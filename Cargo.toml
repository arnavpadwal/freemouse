[package]
name = "FreeMouse"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
name = "freemouse"
path = "src/lib.rs"

[[bin]]
name = "FreeMouse"
path = "src/main.rs"

[dependencies]
eframe = "0.33"
egui-shadcn = "0.5"
tokio = { version = "1.37", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
rand = "0.8.5"
arboard = "3.4.0"
local-ip-address = "0.6.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lazy_static = "1.4"
winresource = "0.1.31"
hostname = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
display-info = "0.4"
notify-rust = "4"
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"
directories = "5"
rfd = "0.15"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rdev = { version = "0.5.3", features = ["unstable_grab"] }
enigo = "0.2.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12.2"

[build-dependencies]
winresource = "0.1"
